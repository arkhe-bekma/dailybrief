<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>account · dailybrief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #0b0d18; --bg-2: #11131f;
      --text: #f3f5fb; --text-2: #c7cad6; --muted: #7a7f95;
      --line: #1c1f2e; --line-2: #2a2e44;
      --neon-mag: #ff2bd6; --neon-cyan: #00e1ff;
      --down: #ff4757; --up: #4ade80;
      --sans: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --display: 'Bricolage Grotesque', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(ellipse at top, rgba(0,225,255,0.05), transparent 50%),
        radial-gradient(ellipse at bottom, rgba(255,43,214,0.04), transparent 50%),
        var(--bg-1);
      color: var(--text);
      font-family: var(--sans);
      padding: 28px 20px 60px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }

    .top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--display);
      font-variation-settings: "opsz" 72, "wdth" 96;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.6px;
      color: var(--text);
      text-decoration: none;
    }
    .brand .logo { color: var(--neon-cyan); font-size: 18px; }
    .back-link {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--neon-cyan); }

    .card {
      background: var(--bg-2);
      border: 1px solid rgba(255,43,214,0.30);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow:
        0 16px 48px rgba(0,0,0,0.45),
        0 0 22px rgba(255,43,214,0.14),
        0 0 0 1px rgba(255,255,255,0.04) inset;
      animation: card-enter 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    /* Light stagger: each card enters ~70ms after the previous. */
    .card:nth-of-type(2) { animation-delay: 80ms; }
    .card:nth-of-type(3) { animation-delay: 160ms; }
    .card:nth-of-type(4) { animation-delay: 240ms; }
    @keyframes card-enter {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* Identity strip — avatar circle + username + role pip */
    .identity {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }
    .avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--display);
      font-variation-settings: "opsz" 24, "wdth" 96;
      font-weight: 700;
      font-size: 24px;
      text-transform: uppercase;
      background: rgba(0,225,255,0.14);
      border: 1px solid rgba(0,225,255,0.50);
      color: var(--neon-cyan);
    }
    .avatar.admin {
      background: rgba(246,192,96,0.18);
      border-color: rgba(246,192,96,0.55);
      color: #f6c060;
    }
    .name-block {
      display: flex; flex-direction: column; gap: 4px;
    }
    .username {
      font-family: var(--display);
      font-variation-settings: "opsz" 72, "wdth" 96;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }
    .pips { display: flex; gap: 6px; flex-wrap: wrap; }
    .pip {
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .pip.role-admin { background: rgba(246,192,96,0.18); color: #f6c060; border: 1px solid rgba(246,192,96,0.45); }
    .pip.role-user  { background: rgba(0,225,255,0.10); color: var(--neon-cyan); border: 1px solid rgba(0,225,255,0.35); }
    .pip.sub-on     { background: rgba(74,222,128,0.10); color: var(--up); border: 1px solid rgba(74,222,128,0.40); }
    .pip.sub-off    { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid var(--line-2); }

    .facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 16px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }
    .fact-key {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 1.4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .fact-val {
      font-family: var(--sans);
      font-size: 13px;
      color: var(--text-2);
    }

    /* Form */
    label.row-label {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.2px;
      color: var(--muted);
      text-transform: uppercase;
      margin: 12px 0 5px;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      background: var(--bg-1);
      border: 1px solid var(--line-2);
      border-radius: 10px;
      padding: 13px 14px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      transition: border-color 160ms, box-shadow 160ms, background 160ms;
    }
    input:hover { border-color: rgba(255,43,214,0.4); }
    input:focus {
      outline: none;
      border-color: var(--neon-cyan);
      background: rgba(0,225,255,0.04);
      box-shadow:
        0 0 0 3px rgba(0,225,255,0.15),
        0 0 18px rgba(0,225,255,0.12);
    }

    .row-actions {
      display: flex; gap: 10px; justify-content: flex-end;
      margin-top: 16px;
    }
    .btn {
      font-family: var(--sans);
      font-weight: 600;
      font-size: 13px;
      padding: 11px 20px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 160ms, border-color 160ms, color 160ms, filter 160ms, transform 80ms, box-shadow 160ms;
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary {
      background: linear-gradient(135deg, rgba(255,43,214,0.92), rgba(255,43,214,0.65));
      border: 1px solid rgba(255,43,214,0.65);
      color: #1a0014;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(255,43,214,0.22);
    }
    .btn-primary:hover { filter: brightness(1.10); box-shadow: 0 6px 22px rgba(255,43,214,0.42); }
    .btn-primary:disabled { opacity: 0.55; cursor: progress; filter: saturate(0.6); }

    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
      color: var(--text-2);
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.40); background: rgba(255,255,255,0.04); color: var(--text); }

    .btn-danger {
      background: transparent;
      border: 1px solid rgba(255,71,87,0.45);
      color: var(--down);
    }
    .btn-danger:hover { background: rgba(255,71,87,0.12); border-color: var(--down); color: #ffd5da; }

    .msg {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      min-height: 16px;
    }
    .msg.err { color: var(--down); }
    .msg.ok  { color: var(--up); }

    .links {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-top: 6px;
    }
    .link-action {
      flex: 1; min-width: 140px;
      text-align: center;
      padding: 14px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: border-color 160ms, color 160ms, background 160ms, transform 80ms, box-shadow 160ms;
    }
    .link-action:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      background: rgba(0,225,255,0.06);
      box-shadow: 0 0 16px rgba(0,225,255,0.18);
    }
    .link-action:active { transform: scale(0.985); }
    .link-action.admin-link { border-color: rgba(246,192,96,0.35); color: #f6c060; }
    .link-action.admin-link:hover { background: rgba(246,192,96,0.08); border-color: #f6c060; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="/"><span class="logo">▮</span><span>dailybrief</span></a>
      <a class="back-link" href="/">← Feed</a>
    </div>

    <!-- Identity card -->
    <section class="card" id="profile-card">
      <div class="identity">
        <div class="avatar" id="avatar">·</div>
        <div class="name-block">
          <span class="username" id="username">…</span>
          <span class="pips" id="pips"></span>
        </div>
      </div>
      <div class="facts">
        <div>
          <div class="fact-key">Username</div>
          <div class="fact-val" id="f-username">—</div>
        </div>
        <div>
          <div class="fact-key">Role</div>
          <div class="fact-val" id="f-role">—</div>
        </div>
        <div>
          <div class="fact-key">Subscription</div>
          <div class="fact-val" id="f-sub">—</div>
        </div>
        <div>
          <div class="fact-key">Member since</div>
          <div class="fact-val" id="f-since">—</div>
        </div>
      </div>
    </section>

    <!-- Change password card -->
    <section class="card">
      <div class="section-label">Change password</div>
      <form id="pw-form" autocomplete="off">
        <label class="row-label" for="pw-old">Current password</label>
        <input id="pw-old" type="password" autocomplete="current-password" required />

        <label class="row-label" for="pw-new">New password</label>
        <input id="pw-new" type="password" autocomplete="new-password" required minlength="4" />

        <label class="row-label" for="pw-confirm">Confirm new password</label>
        <input id="pw-confirm" type="password" autocomplete="new-password" required minlength="4" />

        <div class="msg" id="pw-msg"></div>

        <div class="row-actions">
          <button class="btn btn-ghost" type="reset">Clear</button>
          <button class="btn btn-primary" type="submit" id="pw-submit">Update password</button>
        </div>
      </form>
    </section>

    <!-- Quick actions -->
    <section class="card">
      <div class="section-label">Quick actions</div>
      <div class="links" id="quick-links">
        <a class="link-action" href="/">→ Feed</a>
        <a class="link-action admin-link" id="lab-link" href="/lab" hidden>→ Lab dashboard</a>
        <a class="link-action btn-danger" id="logout-link" href="#">→ Logout</a>
      </div>
    </section>
  </div>

  <script>
    const showErr = (el, msg) => { el.textContent = msg; el.classList.remove("ok"); el.classList.add("err"); };
    const showOk  = (el, msg) => { el.textContent = msg; el.classList.remove("err"); el.classList.add("ok"); };

    const fmtDate = (ts) => {
      if (!ts) return "—";
      const d = new Date(ts * 1000);
      if (isNaN(d)) return "—";
      return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    };

    // Fetch + render profile.
    fetch("/api/auth/profile").then((r) => {
      if (r.status === 401) { location.href = "/login?next=/account"; return null; }
      return r.json();
    }).then((d) => {
      if (!d) return;
      const initial = (d.username || "·").charAt(0);
      const avatar = document.getElementById("avatar");
      avatar.textContent = initial;
      if (d.is_admin) avatar.classList.add("admin");
      document.getElementById("username").textContent = d.username;
      document.getElementById("f-username").textContent = d.username;
      document.getElementById("f-role").textContent = d.is_admin ? "Administrator" : "User";
      document.getElementById("f-sub").textContent = d.subscription ? "Active" : "Inactive";
      document.getElementById("f-since").textContent = fmtDate(d.created_at);
      const pips = document.getElementById("pips");
      pips.innerHTML =
        `<span class="pip ${d.is_admin ? "role-admin" : "role-user"}">${d.is_admin ? "Admin" : "User"}</span>` +
        `<span class="pip ${d.subscription ? "sub-on" : "sub-off"}">${d.subscription ? "Subscribed" : "Free"}</span>`;
      if (d.is_admin) document.getElementById("lab-link").hidden = false;
    }).catch(() => {});

    // Change password
    document.getElementById("pw-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("pw-msg");
      msg.textContent = ""; msg.classList.remove("ok", "err");
      const oldPw = document.getElementById("pw-old").value;
      const newPw = document.getElementById("pw-new").value;
      const confirm = document.getElementById("pw-confirm").value;
      if (newPw !== confirm) return showErr(msg, "New passwords don't match.");
      if (newPw.length < 4) return showErr(msg, "Password must be at least 4 chars.");
      const submit = document.getElementById("pw-submit");
      submit.disabled = true; submit.textContent = "Updating…";
      try {
        const r = await fetch("/api/auth/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ old_password: oldPw, new_password: newPw }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) return showErr(msg, d.detail || `Update failed (HTTP ${r.status})`);
        showOk(msg, "✓ Password updated.");
        document.getElementById("pw-form").reset();
      } catch (err) {
        showErr(msg, err.message || "Network error");
      } finally {
        submit.disabled = false; submit.textContent = "Update password";
      }
    });

    // Logout
    document.getElementById("logout-link").addEventListener("click", async (e) => {
      e.preventDefault();
      try { await fetch("/api/auth/logout", { method: "POST" }); } catch {}
      location.href = "/";
    });
  </script>
</body>
</html>
