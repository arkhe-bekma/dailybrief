<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dailybrief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <span class="logo">▮</span>
      <span class="name">dailybrief</span>
      <span class="date" id="today"></span>
    </div>
    <div class="actions">
      <input id="filter" placeholder="search 검색…" />
      <button id="refresh" title="refresh">↻</button>
      <button id="density" title="toggle density">▦</button>
    </div>
  </header>

  <div class="tape" id="tape"></div>
  <div class="headline" id="headline"></div>

  <nav class="chips" id="chips">
    <button class="chip active" data-cat="all">All<span class="ct" id="ct-all"></span></button>
    <button class="chip cat-world"  data-cat="world">World<span class="ct" id="ct-world"></span></button>
    <button class="chip cat-econ"   data-cat="econ">Markets<span class="ct" id="ct-econ"></span></button>
    <button class="chip cat-tech"   data-cat="tech">Tech<span class="ct" id="ct-tech"></span></button>
    <button class="chip cat-ai"     data-cat="ai">AI<span class="ct" id="ct-ai"></span></button>
    <button class="chip cat-crypto" data-cat="crypto">Crypto<span class="ct" id="ct-crypto"></span></button>
    <button class="chip cat-korea"  data-cat="korea">한국<span class="ct" id="ct-korea"></span></button>
  </nav>

  <div class="layout">
    <main class="main-col">
      <div id="paper"></div>
      <div id="paper-noimg"></div>
    </main>

    <aside id="rail">
      <section class="rail-section rail-whales">
        <div class="rail-head"><span class="dot"></span>🐋 <span class="rail-title">Whales</span></div>
        <div id="rail-whales" class="rail-body"></div>
      </section>
      <section class="rail-section rail-trades">
        <div class="rail-head"><span class="dot"></span>🏛 <span class="rail-title">Insider Trades</span></div>
        <div id="rail-trades" class="rail-body"></div>
      </section>
      <section class="rail-section rail-videos">
        <div class="rail-head"><span class="dot"></span>📺 <span class="rail-title">Watch</span></div>
        <div id="rail-videos" class="rail-body"></div>
      </section>
    </aside>
  </div>

  <div class="pager" id="pager"></div>

  <footer>
    <span class="muted">dailybrief · local · <span id="status">loading…</span></span>
  </footer>

  <!-- Reader modal: clicking a card opens a Claude-summarized reader-mode
       view of the article in-app instead of redirecting. ⌘/Ctrl+click
       still opens the original in a new tab. -->
  <div id="reader" class="reader hidden" aria-hidden="true">
    <div class="reader-backdrop"></div>
    <div class="reader-card" role="dialog" aria-label="article reader">
      <button class="reader-close" aria-label="close">×</button>
      <div class="reader-content"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
