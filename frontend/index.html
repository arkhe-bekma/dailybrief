<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dailybrief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=63" />
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <span class="logo">▮</span>
      <span class="name">dailybrief</span>
    </div>
    <div class="actions">
      <span class="date" id="today"></span>
      <button id="settings-btn" title="settings" aria-label="settings">⚙</button>
    </div>
  </header>

  <!-- Settings popover — opens from the ⚙ in the masthead -->
  <div id="settings-pop" class="settings-pop hidden" aria-hidden="true">
    <div class="settings-row">
      <span class="settings-label">TEXT SIZE</span>
      <div class="settings-segs" id="text-scale-segs">
        <button class="seg" data-scale="0.9">S</button>
        <button class="seg active" data-scale="1.0">M</button>
        <button class="seg" data-scale="1.15">L</button>
        <button class="seg" data-scale="1.3">XL</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">REFRESH</span>
      <div class="settings-segs" id="refresh-segs">
        <button class="seg" data-refresh="0">OFF</button>
        <button class="seg" data-refresh="60">1m</button>
        <button class="seg" data-refresh="120">2m</button>
        <button class="seg active" data-refresh="300">5m</button>
        <button class="seg" data-refresh="600">10m</button>
      </div>
    </div>
    <div class="settings-row settings-row-col">
      <span class="settings-label">INTERESTS — boost categories you care about most</span>
      <div class="interest-grid" id="interest-grid">
        <button class="interest" data-cat="world">◐ World</button>
        <button class="interest" data-cat="econ">▲ Markets</button>
        <button class="interest" data-cat="biz">■ Business</button>
        <button class="interest" data-cat="tech">⌬ Tech</button>
        <button class="interest" data-cat="ai">✦ AI</button>
        <button class="interest" data-cat="crypto">₿ Crypto</button>
        <button class="interest" data-cat="science">⚛ Science</button>
        <button class="interest" data-cat="geo">◈ Geopolitics</button>
        <button class="interest" data-cat="opinion">✎ Op-Ed</button>
        <button class="interest" data-cat="korea">● Korea</button>
        <button class="interest" data-cat="kent">★ K-Ent</button>
      </div>
    </div>
    <div class="settings-row">
      <span class="settings-label">ACCOUNT</span>
      <span class="settings-account">
        <a class="settings-action" href="/lab">→ lab dashboard</a>
        <a class="settings-action" id="settings-login" href="/login">→ login</a>
        <a class="settings-action" id="settings-logout" href="#" hidden>→ logout</a>
      </span>
    </div>
  </div>

  <div class="tape" id="tape"></div>

  <!-- Compact marquee strips for whales / insider trades / videos.
       Each row flows horizontally like the price tape; clicking any
       item opens a detail modal. Replaces the old right rail. -->
  <div class="strip strip-whales"  id="strip-whales"  data-kind="whale"></div>
  <div class="strip strip-trades"  id="strip-trades"  data-kind="trade"></div>
  <div class="strip strip-videos"  id="strip-videos"  data-kind="video"></div>

  <div class="headline" id="headline"></div>

  <nav class="chips" id="chips">
    <button class="chip active" data-cat="all">◎ ALL</button>
    <button class="chip cat-world"   data-cat="world">◐ WLD</button>
    <button class="chip cat-econ"    data-cat="econ">▲ MKT</button>
    <button class="chip cat-biz"     data-cat="biz">■ BIZ</button>
    <button class="chip cat-tech"    data-cat="tech">⌬ TCH</button>
    <button class="chip cat-ai"      data-cat="ai">✦ AI</button>
    <button class="chip cat-crypto"  data-cat="crypto">₿ CRYPT</button>
    <button class="chip cat-science" data-cat="science">⚛ SCI</button>
    <button class="chip cat-geo"     data-cat="geo">◈ GEO</button>
    <button class="chip cat-opinion" data-cat="opinion">✎ OP-ED</button>
    <button class="chip cat-korea"   data-cat="korea">● 한국</button>
    <button class="chip cat-kent"    data-cat="kent">★ K-연예</button>
    <button class="chip-toggle" type="button" id="chip-toggle" aria-label="더보기 / 접기" hidden>▾</button>
  </nav>

  <main class="main-col">
    <div id="paper"></div>
    <div id="paper-noimg"></div>
  </main>

  <div class="pager" id="pager"></div>

  <footer>
    <span class="muted">dailybrief · local · <span id="status">loading…</span></span>
  </footer>

  <!-- Reader modal: clicking a card opens a Claude-summarized reader-mode
       view of the article in-app instead of redirecting. ⌘/Ctrl+click
       still opens the original in a new tab. -->
  <div id="reader" class="reader hidden" aria-hidden="true">
    <div class="reader-backdrop"></div>
    <div class="reader-card" role="dialog" aria-label="article reader">
      <button class="reader-close" aria-label="close">×</button>
      <div class="reader-content"></div>
    </div>
  </div>

  <!-- Delete-with-reason modal — user clicks the × on a card and picks
       why they want it gone; the article is permanently removed from
       the DB and blocked from re-ingest. -->
  <div id="delete-modal" class="reader hidden" aria-hidden="true">
    <div class="reader-backdrop" data-close="delete"></div>
    <div class="delete-card" role="dialog" aria-label="remove article">
      <button class="reader-close" data-close="delete" aria-label="close">×</button>
      <div class="delete-title">Remove article</div>
      <div class="delete-headline" id="delete-headline"></div>
      <div class="delete-sub">Why?</div>
      <div class="delete-reasons" id="delete-reasons">
        <button class="del-reason" data-reason="too-short" type="button">
          <span class="dr-tag">Too short</span>
          <span class="dr-text">Body lacks substance</span>
        </button>
        <button class="del-reason" data-reason="irrelevant" type="button">
          <span class="dr-tag">Off-topic</span>
          <span class="dr-text">Not relevant to me</span>
        </button>
        <button class="del-reason" data-reason="quality" type="button">
          <span class="dr-tag">Low quality</span>
          <span class="dr-text">Weak writing or sourcing</span>
        </button>
        <button class="del-reason" data-reason="clickbait" type="button">
          <span class="dr-tag">Clickbait</span>
          <span class="dr-text">Misleading headline</span>
        </button>
        <button class="del-reason" data-reason="duplicate" type="button">
          <span class="dr-tag">Duplicate</span>
          <span class="dr-text">Already covered</span>
        </button>
        <button class="del-reason" data-reason="broken" type="button">
          <span class="dr-tag">Broken</span>
          <span class="dr-text">Image or render issue</span>
        </button>
        <button class="del-reason" data-reason="other" type="button">
          <span class="dr-tag">Other</span>
          <span class="dr-text">Just remove it</span>
        </button>
      </div>
      <div class="delete-actions">
        <button class="del-cancel" type="button" data-close="delete">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Flow detail modal: clicking a whale / trade / video item opens
       this with kind-specific body content. -->
  <div id="flow" class="reader hidden" aria-hidden="true">
    <div class="reader-backdrop" data-close="flow"></div>
    <div class="reader-card" role="dialog" aria-label="detail">
      <button class="reader-close" data-close="flow" aria-label="close">×</button>
      <div class="reader-content" id="flow-content"></div>
    </div>
  </div>

  <script src="/static/app.js?v=62"></script>
</body>
</html>
