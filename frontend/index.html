<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dailybrief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <span class="logo">▮</span>
      <span class="name">dailybrief</span>
      <span class="date" id="today"></span>
    </div>
    <div class="actions">
      <input id="filter" placeholder="search…" />
      <button id="refresh" title="refresh">↻</button>
      <button id="density" title="toggle density">▦</button>
    </div>
  </header>

  <div class="tape" id="tape"></div>

  <div class="headline" id="headline"></div>

  <nav class="chips" id="chips">
    <button class="chip active" data-cat="all">All<span class="ct" id="ct-all"></span></button>
    <button class="chip" data-cat="hero">★ Top<span class="ct"></span></button>
    <button class="chip cat-world"  data-cat="world">World<span class="ct" id="ct-world"></span></button>
    <button class="chip cat-econ"   data-cat="econ">Markets<span class="ct" id="ct-econ"></span></button>
    <button class="chip cat-tech"   data-cat="tech">Tech<span class="ct" id="ct-tech"></span></button>
    <button class="chip cat-ai"     data-cat="ai">AI<span class="ct" id="ct-ai"></span></button>
    <button class="chip cat-crypto" data-cat="crypto">Crypto<span class="ct" id="ct-crypto"></span></button>
    <button class="chip cat-korea"  data-cat="korea">Korea 한국<span class="ct" id="ct-korea"></span></button>
    <button class="chip cat-whale"  data-cat="whale">🐋 Whales<span class="ct" id="ct-whale"></span></button>
    <button class="chip cat-trade"  data-cat="trade">🏛 Trades<span class="ct" id="ct-trade"></span></button>
    <button class="chip cat-video"  data-cat="video">📺 Video<span class="ct" id="ct-video"></span></button>
  </nav>

  <main>
    <div id="paper"></div>

    <div class="pager" id="pager"></div>
  </main>

  <footer>
    <span class="muted">dailybrief · local · <span id="status">loading…</span></span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
